name: CI and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: offline-bytecode-signature-dumper-linux-x86_64
          - os: windows-latest
            artifact: offline-bytecode-signature-dumper-windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Prepare Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir dist
          cd build
          cmake -E tar czf ../dist/${{ matrix.artifact }}.tar.gz Offline-Bytecode-Signature-Dumper

      - name: Prepare Windows artifact
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir dist
          cd build/Release
          cmake -E tar cf ../../dist/${{ matrix.artifact }}.zip --format=zip Offline-Bytecode-Signature-Dumper.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: offline-bytecode-signature-dumper-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
